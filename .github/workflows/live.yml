name: live demo

# Runs one built demo for real: `flisk up` (Docker + Tilt) on a GitHub-hosted runner,
# exposed through two Cloudflare quick tunnels. The demo page links to them while the job lives.
#
# Three ways in, all carrying the demo id only:
#   - push: every demo branch has a trigger file that calls this workflow (workflow_call),
#   - repository_dispatch: the build, for branches pushed without that file,
#   - workflow_dispatch: by hand, or by retry-live.yml when a run failed.
#
# Live state lives here, not in the Worker's storage: while the demo is up, branch live/<id>
# holds live.json with the tunnel links and the end time; the run deletes it when it ends.
# demo.flisk.sh reads that branch, so a full KV quota can never keep a demo off the air.
# GitHub kills jobs after 6h, hence the timeout.

run-name: live ${{ github.event.client_payload.id || inputs.id }}

on:
  repository_dispatch:
    types: [live-demo]
  workflow_dispatch:
    inputs:
      id:
        description: demo id, e.g. flisk_sh-store-22dc2b
        required: true
  workflow_call:
    inputs:
      id:
        description: demo id or its branch name (demo/<id>)
        type: string
        required: true

# contents: write pushes and deletes live/<id>; actions: read counts the live runs.
permissions:
  contents: write
  actions: read

env:
  ID: ${{ github.event.client_payload.id || inputs.id }}
  TILT_VERSION: 0.37.8
  FLISK_VERSION: 1.4.2
  CLOUDFLARED_VERSION: 2026.10.3
  BUN_VERSION: 1.2.x
  LIVE_MINUTES: ${{ vars.LIVE_MINUTES || 120 }}
  MAX_LIVE: ${{ vars.MAX_LIVE || 20 }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: live-${{ github.event.client_payload.id || inputs.id }}
      cancel-in-progress: false
    steps:
      # The trigger file in a demo branch passes the branch name, demo/<id>.
      - name: Check the demo id
        run: |
          ID="${ID#demo/}"
          if [[ ! "$ID" =~ ^[a-z0-9_-]{1,64}$ ]]; then
            echo "bad demo id: $ID" >&2
            exit 1
          fi
          echo "ID=$ID" >> "$GITHUB_ENV"

      - name: Checkout ops scripts (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: ops
          persist-credentials: false

      - name: Checkout the demo branch
        uses: actions/checkout@v4
        with:
          ref: demo/${{ env.ID }}
          path: demo-src
          persist-credentials: false

      # flisk names the project after its folder, so the demo is moved to <stack>-demo.
      - name: Name the project folder
        run: |
          STACK=$(sed -E 's/-[0-9a-f]{6}$//; s/.*-//' <<<"$ID")
          DIR="${STACK}-demo"
          mv demo-src "$GITHUB_WORKSPACE/$DIR"
          echo "PROJECT=$DIR" >> "$GITHUB_ENV"
          echo "project folder: $DIR"

      # At most MAX_LIVE demos are live at once, so the shared runner pool keeps room for real CI. A slot is a published
      # live/<id> branch. When all slots are taken this run waits for one (checking every 30 s, up to 20 minutes) instead of
      # failing, so a demo built during a busy hour still goes live. If none frees up, it fails and retry-live.yml tries again.
      - name: Claim a live slot
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 40); do
            taken=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/live/" --jq 'length' 2>/dev/null || echo 0)
            echo "live slots taken: $taken of $MAX_LIVE (check $attempt)"
            if [ "$taken" -lt "$MAX_LIVE" ]; then
              echo "live=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::error::no live slot freed up in 20 minutes; retry-live.yml retries this demo later"
          exit 1

      - uses: actions/setup-node@v4
        if: steps.claim.outputs.live == 'true'
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        if: steps.claim.outputs.live == 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Tilt, cloudflared and flisk
        if: steps.claim.outputs.live == 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tilt.tgz" \
            "https://github.com/tilt-dev/tilt/releases/download/v${TILT_VERSION}/tilt.${TILT_VERSION}.linux.x86_64.tar.gz"
          sudo tar -xz -C /usr/local/bin -f "$RUNNER_TEMP/tilt.tgz" tilt
          curl -fsSL -o "$RUNNER_TEMP/cloudflared.deb" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/cloudflared.deb"
          npm i -g "@flisk-sh/flisk@${FLISK_VERSION}"
          tilt version
          cloudflared --version
          flisk --version

      # Containers run as a different uid than the runner, and on Linux the bind-mounted
      # checkout is not writable for them (api-migrator: EACCES mkdir /app/generated).
      # Docker Desktop on macOS hides this. Workaround until Flisk fixes it upstream.
      - name: Let containers write to the checkout
        if: steps.claim.outputs.live == 'true'
        run: chmod -R a+rwX "$GITHUB_WORKSPACE/$PROJECT"

      # No secrets from here on: this step runs the demo's own code.
      # A red resource still leaves Tilt running, and the Tilt UI shows why, so go on to the tunnels.
      - name: flisk up
        if: steps.claim.outputs.live == 'true'
        run: |
          cd "$GITHUB_WORKSPACE/$PROJECT"
          [ -f .env.example ] && [ ! -f .env ] && cp .env.example .env
          flisk project --yes
          if ! timeout 30m flisk up; then
            echo "::warning::flisk up reported a failing resource; Tilt stays up so the live page shows it"
          fi
          flisk status || true

      - name: Read the local URLs
        if: steps.claim.outputs.live == 'true'
        run: |
          cd "$GITHUB_WORKSPACE/$PROJECT"
          flisk up --dry-run | tee "$RUNNER_TEMP/dry-run.txt"
          APP_LOCAL=$(grep -oE 'http://app\.[a-z0-9.-]+\.localhost:[0-9]+' "$RUNNER_TEMP/dry-run.txt" | head -1)
          if [ -z "$APP_LOCAL" ]; then
            echo "no app URL in flisk up --dry-run output" >&2
            exit 1
          fi
          APP_HOST=$(sed -E 's#^http://([^:]+):.*#\1#' <<<"$APP_LOCAL")
          APP_PORT=$(sed -E 's#.*:([0-9]+)$#\1#' <<<"$APP_LOCAL")
          echo "APP_HOST=$APP_HOST" >> "$GITHUB_ENV"
          # The first frontend's route, for example reservation-app in /reservation-app/health. A stack with no
          # frontend named web used to get a link to /web/, which is a 404.
          FRONTEND=$(grep -oE 'http://app\.[a-z0-9.-]+\.localhost[^ /]*/[a-z0-9-]+/' "$RUNNER_TEMP/dry-run.txt" | head -1 | awk -F/ '{print $(NF-1)}')
          echo "FRONTEND=${FRONTEND:-web}" >> "$GITHUB_ENV"
          # Every frontend route in the dry-run output, in order: a restaurant has two (reservation-app, floor-app).
          grep -oE 'http://app\.[a-z0-9.-]+\.localhost[^ /]*/[a-z0-9-]+/' "$RUNNER_TEMP/dry-run.txt" | awk -F/ '{print $(NF-1)}' | awk '!seen[$0]++' > "$RUNNER_TEMP/frontends.txt" || true
          echo "frontends: $(paste -sd' ' "$RUNNER_TEMP/frontends.txt")"
          echo "frontend route: ${FRONTEND:-web}"
          echo "APP_PORT=$APP_PORT" >> "$GITHUB_ENV"

      # Tilt UI (read-only proxy in front of 10350) and the app, each behind its own tunnel.
      # The app tunnel goes through app-proxy.mjs, so /api/* reaches the api on the same origin as the page.
      - name: Open tunnels
        if: steps.claim.outputs.live == 'true'
        run: |
          setsid nohup node "$GITHUB_WORKSPACE/ops/scripts/readonly-proxy.mjs" > "$RUNNER_TEMP/proxy.log" 2>&1 < /dev/null &
          setsid nohup env APP_HOST="$APP_HOST" TRAEFIK_PORT="$APP_PORT" PROXY_PORT=10352 \
            node "$GITHUB_WORKSPACE/ops/scripts/app-proxy.mjs" > "$RUNNER_TEMP/app-proxy.log" 2>&1 < /dev/null &
          setsid nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:10351 > "$RUNNER_TEMP/tilt-tunnel.log" 2>&1 < /dev/null &
          setsid nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:10352 > "$RUNNER_TEMP/app-tunnel.log" 2>&1 < /dev/null &
          tunnel_url() {
            for _ in $(seq 60); do
              url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$1" | head -1 || true)
              if [ -n "$url" ]; then echo "$url"; return 0; fi
              sleep 2
            done
            echo "no tunnel URL in $1" >&2
            return 1
          }
          tilt_url=$(tunnel_url "$RUNNER_TEMP/tilt-tunnel.log")
          app_url=$(tunnel_url "$RUNNER_TEMP/app-tunnel.log")
          echo "$tilt_url" > "$RUNNER_TEMP/tilt-url"
          echo "$app_url/$FRONTEND/" > "$RUNNER_TEMP/app-url"
          {
            echo "### Live demo"
            echo "- Tilt UI (read-only): $tilt_url"
            echo "- App: $app_url/$FRONTEND/"
            echo "- API health: $app_url/api/health"
          } >> "$GITHUB_STEP_SUMMARY"

      # One commit on branch live/<id>: demo.flisk.sh reads live.json from it. A push with
      # GITHUB_TOKEN starts no workflow, and the branch has no workflow file anyway.
      - name: Publish the live links
        if: steps.claim.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          until_ms=$(( ($(date +%s) + LIVE_MINUTES * 60) * 1000 ))
          dir="$RUNNER_TEMP/live-state"
          mkdir -p "$dir"
          # frontends: each frontend's name and its route under the app tunnel, so the page can show them all.
          front=$(jq -Rn --arg root "$(sed -E 's#^(https://[^/]+).*#\1#' "$RUNNER_TEMP/app-url")" \
            '[inputs | select(length > 0) | {name: ., url: ($root + "/" + . + "/")}]' < "$RUNNER_TEMP/frontends.txt")
          jq -n --arg tilt "$(cat "$RUNNER_TEMP/tilt-url")" --arg app "$(cat "$RUNNER_TEMP/app-url")" \
            --argjson until "$until_ms" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --argjson frontends "$front" \
            '{tilt:$tilt, app:$app, until:$until, run:$run, frontends:$frontends}' > "$dir/live.json"
          cat "$dir/live.json"
          git -C "$dir" init -q -b "live/$ID"
          git -C "$dir" add live.json
          git -C "$dir" -c user.name=flisk-demo -c user.email=demo@flisk.sh commit -q -m "live: $ID"
          git -C "$dir" push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/live/$ID"
          echo "live until $(date -u -d "@$((until_ms / 1000))" +%H:%M) UTC"

      - name: Keep the demo up
        if: steps.claim.outputs.live == 'true'
        run: |
          minutes=$LIVE_MINUTES
          if [ "$minutes" -gt 330 ]; then minutes=330; fi
          echo "staying up for ${minutes} minutes"
          sleep "$((minutes * 60))"

      - name: Take the demo down
        if: always() && steps.claim.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/live/$ID" >/dev/null 2>&1 || true
          cd "$GITHUB_WORKSPACE/$PROJECT" && flisk down || true
